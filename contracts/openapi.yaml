        modelVersion:
          type: string
          maxLength: 32
          example: rule-engine-1.0.0
        evaluatedAt:
          type: string
          format: date-time
        warningId:
          oneOf:
            - $ref: '#/components/schemas/WarningId'
            - type: 'null'
      additionalProperties: false

    Warning:
