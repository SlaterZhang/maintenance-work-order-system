        - priority
        - status
        - reporterId
        - assigneeId
        - dueAt
        - conclusion
        - version
        - createdAt
        - updatedAt
      properties:
        orderId:
          $ref: '#/components/schemas/OrderId'
        sourceType:
          $ref: '#/components/schemas/WorkOrderSource'
        warningId:
          oneOf:
            - $ref: '#/components/schemas/WarningId'
            - type: 'null'
        equipmentId:
          $ref: '#/components/schemas/EquipmentId'
        equipmentNameSnapshot:
          type: string
          minLength: 1
          maxLength: 100
        title:
          type: string
          minLength: 1
          maxLength: 120
        description:
          type: string
          minLength: 1
          maxLength: 2000
        priority:
          $ref: '#/components/schemas/WorkOrderPriority'
        status:
          $ref: '#/components/schemas/WorkOrderStatus'
        reporterId:
          $ref: '#/components/schemas/UserId'
        assigneeId:
          oneOf:
            - $ref: '#/components/schemas/UserId'
            - type: 'null'
        dueAt:
          type: [string, 'null']
          format: date-time
        conclusion:
          oneOf:
            - $ref: '#/components/schemas/MaintenanceConclusion'
