        - title
        - description
        - priority
        - reporterId
      properties:
        sourceType:
          type: string
          enum: [MANUAL, INSPECTION]
        equipmentId:
          $ref: '#/components/schemas/EquipmentId'
        title:
          type: string
          minLength: 1
          maxLength: 120
        description:
          type: string
          minLength: 1
          maxLength: 2000
        priority:
          $ref: '#/components/schemas/WorkOrderPriority'
        reporterId:
          $ref: '#/components/schemas/UserId'
        dueAt:
          type: [string, 'null']
          format: date-time
      additionalProperties: false

    WorkOrderCommandRequest:
      type: object
      required: [action, operatorId, expectedVersion]
      properties:
        action:
          $ref: '#/components/schemas/WorkOrderAction'
        operatorId:
          $ref: '#/components/schemas/UserId'
        expectedVersion:
          type: integer
          minimum: 0
        assigneeId:
          oneOf:
            - $ref: '#/components/schemas/UserId'
            - type: 'null'
          description: action=ASSIGN 时必填
        comment:
          type: [string, 'null']
          maxLength: 500
        conclusion:
          oneOf:
            - $ref: '#/components/schemas/MaintenanceConclusionInput'
            - type: 'null'
          description: action=SUBMIT_FOR_INSPECTION 时必填
      additionalProperties: false

    MaintenanceConclusionInput:
      type: object
      required: [rootCause, measures, result, effective, completedAt]
      properties:
        rootCause:
          type: string
          minLength: 1
          maxLength: 500
        measures:
          type: string
          minLength: 1
          maxLength: 1000
        result:
          $ref: '#/components/schemas/MaintenanceResult'
        effective:
          type: boolean
        completedAt:
          type: string
          format: date-time
        downtimeMinutes:
          type: [integer, 'null']
          minimum: 0
      additionalProperties: false

    MaintenanceConclusion:
      allOf:
        - $ref: '#/components/schemas/MaintenanceConclusionInput'
        - type: object
          required: [submittedBy]
          properties:
            submittedBy:
              $ref: '#/components/schemas/UserId'

    SparePart:
      type: object
      required:
        - sparePartId
        - name
        - specification
        - unit
        - onHandQuantity
        - reservedQuantity
        - availableQuantity
        - reorderPoint
        - version
      properties:
        sparePartId:
          $ref: '#/components/schemas/SparePartId'
        name:
          type: string
          minLength: 1
          maxLength: 100
        specification:
          type: string
          minLength: 1
          maxLength: 200
        unit:
          type: string
          minLength: 1
          maxLength: 20
          example: 个
        onHandQuantity:
          type: integer
          minimum: 0
        reservedQuantity:
          type: integer
          minimum: 0
        availableQuantity:
          type: integer
          minimum: 0
          description: onHandQuantity - reservedQuantity
        reorderPoint:
          type: integer
          minimum: 0
        version:
          type: integer
          minimum: 0
      additionalProperties: false

    SparePartPage:
      type: object
      required: [items, page, pageSize, total, totalPages]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SparePart'
        page:
          type: integer
          minimum: 1
        pageSize:
          type: integer
          minimum: 1
        total:
          type: integer
          minimum: 0
        totalPages:
          type: integer
          minimum: 0
      additionalProperties: false

    SpareRequest:
      type: object
      required:
        - requestId
        - orderId
        - sparePartId
        - requestedQuantity
        - approvedQuantity
        - issuedQuantity
        - returnedQuantity
        - status
        - requesterId
        - approverId
        - version
        - createdAt
        - updatedAt
      properties:
        requestId:
          $ref: '#/components/schemas/SpareRequestId'
        orderId:
          $ref: '#/components/schemas/OrderId'
        sparePartId:
          $ref: '#/components/schemas/SparePartId'
        requestedQuantity:
          type: integer
          minimum: 1
        approvedQuantity:
          type: integer
          minimum: 0
        issuedQuantity:
          type: integer
          minimum: 0
        returnedQuantity:
          type: integer
          minimum: 0
        status:
          $ref: '#/components/schemas/SpareRequestStatus'
        requesterId:
          $ref: '#/components/schemas/UserId'
        approverId:
          oneOf:
            - $ref: '#/components/schemas/UserId'
            - type: 'null'
        reason:
          type: [string, 'null']
          maxLength: 500
        version:
          type: integer
          minimum: 0
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      additionalProperties: false

    CreateSpareRequestRequest:
      type: object
      required: [sparePartId, requestedQuantity, requesterId, reason]
      properties:
        sparePartId:
          $ref: '#/components/schemas/SparePartId'
        requestedQuantity:
          type: integer
          minimum: 1
          maximum: 10000
        requesterId:
          $ref: '#/components/schemas/UserId'
        reason:
          type: string
          minLength: 1
          maxLength: 500
      additionalProperties: false

    SpareRequestCommandRequest:
      type: object
      required: [action, operatorId, expectedVersion]
      properties:
        action:
          $ref: '#/components/schemas/SpareRequestAction'
        operatorId:
          $ref: '#/components/schemas/UserId'
        expectedVersion:
          type: integer
          minimum: 0
        quantity:
          type: [integer, 'null']
          minimum: 1
          description: APPROVE、ISSUE、RETURN 时按动作规则填写
        comment:
          type: [string, 'null']
          maxLength: 500
      additionalProperties: false

    EventEnvelopeBase:
      type: object
      required:
        - eventId
        - eventType
        - schemaVersion
        - occurredAt
        - sourceMember
        - traceId
        - payload
      properties:
        eventId:
          type: string
          format: uuid
        eventType:
          type: string
        schemaVersion:
          type: string
          pattern: '^2\.[0-9]+$'
        occurredAt:
          type: string
          format: date-time
        sourceMember:
          type: string
          enum: [MEMBER_A, MEMBER_B, MEMBER_C, MEMBER_D]
        traceId:
          type: string
          minLength: 8
          maxLength: 64
        payload:
          type: object

    WarningRaisedEvent:
      allOf:
        - $ref: '#/components/schemas/EventEnvelopeBase'
        - type: object
          properties:
            eventType:
              const: WarningRaised
            sourceMember:
              const: MEMBER_B
            payload:
              $ref: '#/components/schemas/WarningRaisedPayload'

    WarningRaisedPayload:
      type: object
      required:
        - warningId
        - equipmentId
        - riskLevel
        - healthScore
        - suspectedFault
        - recommendedAction
        - warningAt
        - modelVersion
        - metricSnapshot
      properties:
        warningId:
          $ref: '#/components/schemas/WarningId'
        equipmentId:
          $ref: '#/components/schemas/EquipmentId'
        riskLevel:
          $ref: '#/components/schemas/RiskLevel'
        healthScore:
          type: number
          minimum: 0
          maximum: 100
        suspectedFault:
          type: string
          minLength: 1
          maxLength: 200
        recommendedAction:
          type: string
          minLength: 1
          maxLength: 500
        warningAt:
          type: string
          format: date-time
        modelVersion:
          type: string
          minLength: 1
          maxLength: 32
        metricSnapshot:
          $ref: '#/components/schemas/TelemetrySample'
      additionalProperties: false

    EquipmentStatusChangedEvent:
      allOf:
        - $ref: '#/components/schemas/EventEnvelopeBase'
        - type: object
          properties:
            eventType:
              const: EquipmentStatusChanged
            sourceMember:
              const: MEMBER_C
            payload:
              $ref: '#/components/schemas/EquipmentStatusChangedPayload'

    EquipmentStatusChangedPayload:
      type: object
      required: [orderId, equipmentId, targetStatus, operatorId, reason]
      properties:
        orderId:
          $ref: '#/components/schemas/OrderId'
        equipmentId:
          $ref: '#/components/schemas/EquipmentId'
        targetStatus:
          $ref: '#/components/schemas/EquipmentStatus'
        operatorId:
          $ref: '#/components/schemas/UserId'
        reason:
          type: string
          minLength: 1
          maxLength: 300
      additionalProperties: false

    MaintenanceConclusionEvent:
      allOf:
        - $ref: '#/components/schemas/EventEnvelopeBase'
        - type: object
          properties:
            eventType:
              const: MaintenanceConclusionReported
            sourceMember:
              const: MEMBER_C
            payload:
              $ref: '#/components/schemas/MaintenanceConclusionPayload'

    MaintenanceConclusionPayload:
      type: object
      required:
        - orderId
        - warningId
        - equipmentId
        - rootCause
        - measures
        - result
        - completedAt
        - effective
        - submittedBy
      properties:
        orderId:
          $ref: '#/components/schemas/OrderId'
        warningId:
          oneOf:
            - $ref: '#/components/schemas/WarningId'
            - type: 'null'
        equipmentId:
          $ref: '#/components/schemas/EquipmentId'
        rootCause:
          type: string
          minLength: 1
          maxLength: 500
        measures:
          type: string
          minLength: 1
          maxLength: 1000
        result:
          $ref: '#/components/schemas/MaintenanceResult'
        completedAt:
          type: string
          format: date-time
        effective:
          type: boolean
        submittedBy:
          $ref: '#/components/schemas/UserId'
        downtimeMinutes:
          type: [integer, 'null']
          minimum: 0
      additionalProperties: false

    WarningAcceptedResponse:
      type: object
      required: [accepted, duplicate, orderId, traceId]
      properties:
        accepted:
          type: boolean
          const: true
        duplicate:
          type: boolean
        orderId:
          $ref: '#/components/schemas/OrderId'
        traceId:
          type: string
      additionalProperties: false

    EventAcceptedResponse:
      type: object
      required: [accepted, duplicate, traceId]
      properties:
        accepted:
          type: boolean
          const: true
        duplicate:
          type: boolean
        traceId:
          type: string
      additionalProperties: false

    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 50
        password:
          type: string
          minLength: 6
          maxLength: 100
          format: password
      additionalProperties: false

    LoginResponse:
      type: object
      required: [accessToken, tokenType, expiresInSeconds, user]
      properties:
        accessToken:
          type: string
          minLength: 1
        tokenType:
          type: string
          const: Bearer
        expiresInSeconds:
          type: integer
          minimum: 60
          example: 7200
        user:
          $ref: '#/components/schemas/UserAccessContext'
      additionalProperties: false

    UserAccessContext:
      type: object
      required:
        - userId
        - displayName
        - roleCodes
        - permissions
        - organization
        - enabled
      properties:
        userId:
          $ref: '#/components/schemas/UserId'
        displayName:
          type: string
          minLength: 1
          maxLength: 100
        roleCodes:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/RoleCode'
          example: [MAINTENANCE_ENGINEER]
        permissions:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/PermissionCode'
          example: [WORK_ORDER_ACCEPT, WORK_ORDER_MAINTAIN]
        organization:
          type: string
          maxLength: 100
        enabled:
          type: boolean
      additionalProperties: false

    NotificationRequest:
      type: object
      required: [recipientUserIds, templateCode, channel, variables]
      properties:
        recipientUserIds:
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          items:
            $ref: '#/components/schemas/UserId'
        templateCode:
          type: string
          enum:
            - WARNING_CREATED
            - WORK_ORDER_CREATED
            - WORK_ORDER_ASSIGNED
            - WORK_ORDER_STATUS_CHANGED
            - SPARE_REQUEST_PENDING
        channel:
          $ref: '#/components/schemas/NotificationChannel'
        variables:
          type: object
          additionalProperties:
            type: string
        businessReference:
          type: [string, 'null']
          maxLength: 64
      additionalProperties: false

    NotificationAcceptedResponse:
      type: object
      required: [notificationId, accepted, duplicate, traceId]
      properties:
        notificationId:
          type: string
          pattern: '^NOTICE-[0-9]{8}-[0-9]{4}$'
        accepted:
          type: boolean
          const: true
        duplicate:
          type: boolean
        traceId:
          type: string
      additionalProperties: false

    FieldViolation:
      type: object
      required: [field, reason]
      properties:
        field:
          type: string
        reason:
          type: string
      additionalProperties: false

    ErrorResponse:
      type: object
      required: [code, message, traceId, timestamp, details]
      properties:
        code:
          type: string
          pattern: '^[A-Z][A-Z0-9_]*$'
          example: EQUIPMENT_NOT_FOUND
        message:
          type: string
          example: 设备不存在
        traceId:
          type: string
          minLength: 8
          maxLength: 64
        timestamp:
          type: string
          format: date-time
        details:
          type: array
          items:
            $ref: '#/components/schemas/FieldViolation'
      additionalProperties: false
