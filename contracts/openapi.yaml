openapi: 3.1.0
info:
  title: 工业设备智能运维系统跨模块接口
  version: 1.1.0
  description: |
    成员 A（设备监测）、B（故障预警）、C（维修工单）、D（系统集成与质量）之间的逻辑接口。
    实际部署地址由环境变量配置；接口字段变更必须通过契约变更 PR。
tags:
  - name: C-INT-01
    description: 设备主数据查询
  - name: C-INT-02
    description: 预警事件接收
  - name: C-INT-03
    description: 设备维修状态反馈
  - name: C-INT-04
    description: 维修结论反馈
  - name: C-INT-05
    description: 统一身份、权限与通知
paths:
  /api/v1/equipment/{equipmentId}:
    get:
      tags:
        - C-INT-01
      summary: 查询设备主数据
      operationId: getEquipmentById
      x-provider-member: MEMBER_A
      x-caller-member: MEMBER_C
      servers:
        - url: http://localhost:8101
          description: 成员 A 设备服务本地地址
      parameters:
        - name: equipmentId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 32
        - $ref: '#/components/parameters/TraceIdHeader'
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EquipmentSnapshot'
        '404':
          description: 设备不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/warnings:
    post:
      tags:
        - C-INT-02
      summary: 接收故障预警并生成或关联工单
      operationId: consumeWarningRaised
      x-provider-member: MEMBER_C
      x-caller-member: MEMBER_B
      servers:
        - url: http://localhost:8103
          description: 成员 C 维修工单服务本地地址
      parameters:
        - $ref: '#/components/parameters/TraceIdHeader'
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WarningRaisedEvent'
      responses:
        '202':
          description: 事件已接收；重复事件返回原工单标识
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WarningAcceptedResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: 同一 WarningId 与已有业务事实冲突
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/equipment-status-events:
    post:
      tags:
        - C-INT-03
      summary: 接收维修过程中的设备状态变化
      operationId: consumeEquipmentStatusChanged
      x-provider-member: MEMBER_A
      x-caller-member: MEMBER_C
      servers:
        - url: http://localhost:8101
          description: 成员 A 设备服务本地地址
      parameters:
        - $ref: '#/components/parameters/TraceIdHeader'
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EquipmentStatusChangedEvent'
      responses:
        '202':
          $ref: '#/components/responses/EventAccepted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          description: 设备不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/maintenance-conclusions:
    post:
      tags:
        - C-INT-04
      summary: 接收实际根因和维修结论
      operationId: consumeMaintenanceConclusion
      x-provider-member: MEMBER_B
      x-caller-member: MEMBER_C
      servers:
        - url: http://localhost:8102
          description: 成员 B 预警服务本地地址
      parameters:
        - $ref: '#/components/parameters/TraceIdHeader'
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MaintenanceConclusionEvent'
      responses:
        '202':
          $ref: '#/components/responses/EventAccepted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          description: 预警不存在或已归档
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/users/{userId}/access-context:
    get:
      tags:
        - C-INT-05
      summary: 查询用户的统一身份与权限上下文
      operationId: getUserAccessContext
      x-provider-member: MEMBER_D
      x-caller-members:
        - MEMBER_A
        - MEMBER_B
        - MEMBER_C
      servers:
        - url: http://localhost:8104
          description: 成员 D 集成服务本地地址
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 32
        - $ref: '#/components/parameters/TraceIdHeader'
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserAccessContext'
        '404':
          description: 用户不存在或已停用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/notifications:
    post:
      tags:
        - C-INT-05
      summary: 提交通知任务
      operationId: submitNotification
      x-provider-member: MEMBER_D
      x-caller-members:
        - MEMBER_A
        - MEMBER_B
        - MEMBER_C
      servers:
        - url: http://localhost:8104
          description: 成员 D 集成服务本地地址
      parameters:
        - $ref: '#/components/parameters/TraceIdHeader'
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotificationRequest'
      responses:
        '202':
          description: 通知任务已接收
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationAcceptedResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

components:
  parameters:
    TraceIdHeader:
      name: X-Trace-Id
      in: header
      required: true
      description: 贯穿一次端到端业务链路的追踪标识
      schema:
        type: string
        minLength: 1
        maxLength: 64
    IdempotencyKeyHeader:
      name: Idempotency-Key
      in: header
      required: true
      description: 使用事件的 eventId；同一事件重试时保持不变
      schema:
        type: string
        format: uuid

  responses:
    EventAccepted:
      description: 事件已接收；重复事件应安全返回相同处理结果
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/EventAcceptedResponse'
    BadRequest:
      description: 请求字段、枚举或状态不合法
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalError:
      description: 服务内部错误
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    EquipmentSnapshot:
      type: object
      required:
        - equipmentId
        - name
        - type
        - productionLine
        - currentStatus
        - version
      properties:
        equipmentId:
          type: string
          example: EQ-000001
        name:
          type: string
          example: 一号数控机床
        type:
          type: string
          example: CNC
        productionLine:
          type: string
          example: LINE-01
        currentStatus:
          $ref: '#/components/schemas/EquipmentStatus'
        responsibleDepartment:
          type:
            - string
            - 'null'
          example: 机加车间
        version:
          type: integer
          minimum: 0
          description: 乐观锁或快照版本
          example: 12
      additionalProperties: false

    EventEnvelopeBase:
      type: object
      required:
        - eventId
        - eventType
        - schemaVersion
        - occurredAt
        - sourceMember
        - traceId
        - payload
      properties:
        eventId:
          type: string
          format: uuid
        eventType:
          type: string
        schemaVersion:
          type: string
          pattern: '^1\.[0-9]+$'
        occurredAt:
          type: string
          format: date-time
        sourceMember:
          type: string
          enum:
            - MEMBER_A
            - MEMBER_B
            - MEMBER_C
            - MEMBER_D
        traceId:
          type: string
          minLength: 1
          maxLength: 64
        payload:
          type: object

    WarningRaisedEvent:
      allOf:
        - $ref: '#/components/schemas/EventEnvelopeBase'
        - type: object
          properties:
            eventType:
              const: WarningRaised
            sourceMember:
              const: MEMBER_B
            payload:
              $ref: '#/components/schemas/WarningRaisedPayload'

    WarningRaisedPayload:
      type: object
      required:
        - warningId
        - equipmentId
        - riskLevel
        - suspectedFault
        - warningAt
        - modelVersion
      properties:
        warningId:
          type: string
          example: WARN-20260917-0001
        equipmentId:
          type: string
          example: EQ-000001
        riskLevel:
          $ref: '#/components/schemas/RiskLevel'
        healthScore:
          type:
            - number
            - 'null'
          minimum: 0
          maximum: 100
          example: 42.5
        suspectedFault:
          type: string
          example: 主轴轴承振动异常
        warningAt:
          type: string
          format: date-time
        modelVersion:
          type: string
          example: health-model-1.3.0
      additionalProperties: false

    EquipmentStatusChangedEvent:
      allOf:
        - $ref: '#/components/schemas/EventEnvelopeBase'
        - type: object
          properties:
            eventType:
              const: EquipmentStatusChanged
            sourceMember:
              const: MEMBER_C
            payload:
              $ref: '#/components/schemas/EquipmentStatusChangedPayload'

    EquipmentStatusChangedPayload:
      type: object
      required:
        - orderId
        - equipmentId
        - targetStatus
        - operatorId
        - reason
      properties:
        orderId:
          type: string
          example: WO-20260917-0001
        equipmentId:
          type: string
          example: EQ-000001
        targetStatus:
          $ref: '#/components/schemas/EquipmentStatus'
        operatorId:
          type: string
          example: USER-C-002
        reason:
          type: string
          example: 维修工程师已接单并开始检修
      additionalProperties: false

    MaintenanceConclusionEvent:
      allOf:
        - $ref: '#/components/schemas/EventEnvelopeBase'
        - type: object
          properties:
            eventType:
              const: MaintenanceConclusionReported
            sourceMember:
              const: MEMBER_C
            payload:
              $ref: '#/components/schemas/MaintenanceConclusionPayload'

    MaintenanceConclusionPayload:
      type: object
      required:
        - orderId
        - warningId
        - equipmentId
        - rootCause
        - measures
        - result
        - completedAt
        - effective
      properties:
        orderId:
          type: string
        warningId:
          type:
            - string
            - 'null'
        equipmentId:
          type: string
        rootCause:
          type: string
        measures:
          type: string
        result:
          type: string
          enum:
            - RECOVERED
            - PARTIALLY_RECOVERED
            - NOT_RECOVERED
        completedAt:
          type: string
          format: date-time
        effective:
          type: boolean
      additionalProperties: false

    WarningAcceptedResponse:
      type: object
      required:
        - accepted
        - duplicate
        - orderId
        - traceId
      properties:
        accepted:
          type: boolean
          const: true
        duplicate:
          type: boolean
        orderId:
          type: string
          example: WO-20260917-0001
        traceId:
          type: string
      additionalProperties: false

    EventAcceptedResponse:
      type: object
      required:
        - accepted
        - duplicate
        - traceId
      properties:
        accepted:
          type: boolean
          const: true
        duplicate:
          type: boolean
        traceId:
          type: string
      additionalProperties: false

    UserAccessContext:
      type: object
      required:
        - userId
        - displayName
        - roleCodes
        - permissions
        - organization
        - enabled
      properties:
        userId:
          type: string
          example: USER-C-002
        displayName:
          type: string
          example: 维修工程师示例
        roleCodes:
          type: array
          items:
            type: string
          uniqueItems: true
          example:
            - MAINTENANCE_ENGINEER
        permissions:
          type: array
          items:
            type: string
          uniqueItems: true
          example:
            - WORK_ORDER_ACCEPT
            - WORK_LOG_WRITE
        organization:
          type: string
          example: 机加车间
        enabled:
          type: boolean
          example: true
      additionalProperties: false

    NotificationRequest:
      type: object
      required:
        - recipientUserIds
        - templateCode
        - channel
        - variables
      properties:
        recipientUserIds:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
        templateCode:
          type: string
          example: WORK_ORDER_ASSIGNED
        channel:
          $ref: '#/components/schemas/NotificationChannel'
        variables:
          type: object
          additionalProperties:
            type: string
          example:
            orderId: WO-20260917-0001
            equipmentName: 一号数控机床
        businessReference:
          type:
            - string
            - 'null'
          description: 关联的 OrderId、WarningId 或其他业务标识
      additionalProperties: false

    NotificationAcceptedResponse:
      type: object
      required:
        - notificationId
        - accepted
        - duplicate
        - traceId
      properties:
        notificationId:
          type: string
          example: NOTICE-20260917-0001
        accepted:
          type: boolean
          const: true
        duplicate:
          type: boolean
        traceId:
          type: string
      additionalProperties: false

    ErrorResponse:
      type: object
      required:
        - code
        - message
        - traceId
      properties:
        code:
          type: string
          example: EQUIPMENT_NOT_FOUND
        message:
          type: string
          example: 设备不存在
        traceId:
          type: string
        details:
          type: object
          additionalProperties: true
      additionalProperties: false

    EquipmentStatus:
      type: string
      enum:
        - RUNNING
        - WARNING
        - STOPPED
        - MAINTAINING
        - TRIAL_RUNNING

    RiskLevel:
      type: string
      enum:
        - LOW
        - MEDIUM
        - HIGH
        - CRITICAL

    NotificationChannel:
      type: string
      enum:
        - IN_APP
        - EMAIL
        - SMS
