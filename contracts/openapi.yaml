components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 登录接口签发的访问令牌
    internalToken:
      type: apiKey
      in: header
      name: X-Internal-Token
      description: 本地开发由 INTERNAL_API_TOKEN 环境变量提供

  parameters:
    TraceIdHeader:
      name: X-Trace-Id
      in: header
      required: false
      description: 调用方可传；缺失时网关生成并回传
      schema:
        type: string
        minLength: 8
        maxLength: 64
    RequiredTraceIdHeader:
      name: X-Trace-Id
      in: header
      required: true
      description: 服务间调用必须沿用同一业务链路的追踪标识
      schema:
        type: string
        minLength: 8
        maxLength: 64
    IdempotencyKeyHeader:
      name: Idempotency-Key
      in: header
      required: true
      description: UUID；同一业务写请求重试时保持不变
      schema:
        type: string
        format: uuid
    PageParameter:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSizeParameter:
      name: pageSize
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    EquipmentIdParameter:
      name: equipmentId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/EquipmentId'
    WarningIdParameter:
      name: warningId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/WarningId'
    OrderIdParameter:
      name: orderId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/OrderId'
    SpareRequestIdParameter:
      name: requestId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/SpareRequestId'
    UserIdParameter:
      name: userId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/UserId'

  responses:
    EventAccepted:
      description: 事件已接收；重复事件安全返回相同处理结果
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/EventAcceptedResponse'
    BadRequest:
      description: 字段缺失、格式错误、枚举错误或查询参数不合法
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: 未登录、JWT 无效或内部令牌无效
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: 身份有效但缺少该操作所需权限
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: 指定业务对象不存在
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: 当前状态不允许操作、版本冲突或幂等键对应不同请求
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalError:
      description: 服务内部错误；不得向客户端暴露堆栈或数据库细节
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    EquipmentId:
      type: string
      pattern: '^EQ-[0-9]{6}$'
      example: EQ-000001
    WarningId:
      type: string
      pattern: '^WARN-[0-9]{8}-[0-9]{4}$'
      example: WARN-20260917-0001
    OrderId:
      type: string
      pattern: '^WO-[0-9]{8}-[0-9]{4}$'
      example: WO-20260917-0001
    SparePartId:
      type: string
      pattern: '^SP-[0-9]{6}$'
      example: SP-000001
    SpareRequestId:
      type: string
      pattern: '^SPR-[0-9]{8}-[0-9]{4}$'
      example: SPR-20260917-0001
    UserId:
      type: string
      pattern: '^USER-[A-Z0-9-]{1,27}$'
      example: USER-C-002

    EquipmentStatus:
      type: string
      enum: [RUNNING, WARNING, STOPPED, MAINTAINING, TRIAL_RUNNING]
    RiskLevel:
      type: string
      enum: [LOW, MEDIUM, HIGH, CRITICAL]
    WarningStatus:
      type: string
      enum: [OPEN, ACKNOWLEDGED, LINKED_TO_ORDER, RESOLVED, FALSE_POSITIVE]
    WorkOrderStatus:
      type: string
      enum:
        - PENDING_CONFIRMATION
        - PENDING_ASSIGNMENT
        - PENDING_ACCEPTANCE
        - PENDING_MAINTENANCE
        - MAINTAINING
        - WAITING_PARTS
        - PENDING_INSPECTION
        - COMPLETED
        - CANCELLED
    WorkOrderPriority:
      type: string
      enum: [P1, P2, P3, P4]
    WorkOrderSource:
      type: string
      enum: [WARNING, MANUAL, INSPECTION]
    WorkOrderAction:
      type: string
      enum:
        - CONFIRM
        - ASSIGN
        - ACCEPT
        - START
        - WAIT_FOR_PARTS
        - RESUME
        - SUBMIT_FOR_INSPECTION
        - PASS_INSPECTION
        - REJECT_INSPECTION
        - CANCEL
    SpareRequestStatus:
      type: string
      enum:
        - PENDING_APPROVAL
        - APPROVED
        - RESERVED
        - ISSUED
        - PARTIALLY_RETURNED
        - CLOSED
        - REJECTED
        - CANCELLED
    SpareRequestAction:
      type: string
      enum: [APPROVE, REJECT, RESERVE, ISSUE, RETURN, CLOSE, CANCEL]
    MaintenanceResult:
      type: string
      enum: [RECOVERED, PARTIALLY_RECOVERED, NOT_RECOVERED]
    NotificationChannel:
      type: string
      enum: [IN_APP, EMAIL]
    RoleCode:
      type: string
      enum:
        - SYSTEM_ADMIN
        - EQUIPMENT_OPERATOR
        - WARNING_ANALYST
        - MAINTENANCE_SUPERVISOR
        - MAINTENANCE_ENGINEER
        - WAREHOUSE_MANAGER
        - INSPECTOR
    PermissionCode:
      type: string
      enum:
        - ADMIN_ALL
        - EQUIPMENT_READ
        - EQUIPMENT_MANAGE
        - TELEMETRY_READ
        - TELEMETRY_WRITE
        - WARNING_READ
        - WARNING_ACKNOWLEDGE
        - WORK_ORDER_READ
        - WORK_ORDER_CREATE
        - WORK_ORDER_CONFIRM
        - WORK_ORDER_ASSIGN
        - WORK_ORDER_ACCEPT
        - WORK_ORDER_MAINTAIN
        - WORK_ORDER_INSPECT
        - WORK_ORDER_CANCEL
        - SPARE_READ
        - SPARE_REQUEST
        - SPARE_APPROVE
        - SPARE_ISSUE
        - USER_ACCESS_READ
        - NOTIFICATION_SEND

    Equipment:
      type: object
      required:
        - equipmentId
        - name
        - equipmentType
        - productionLineId
        - location
        - currentStatus
        - enabled
        - version
        - createdAt
        - updatedAt
      properties:
        equipmentId:
          $ref: '#/components/schemas/EquipmentId'
        name:
          type: string
          minLength: 1
          maxLength: 100
          example: 一号数控机床
        equipmentType:
          type: string
          minLength: 1
          maxLength: 50
          example: CNC
        productionLineId:
          type: string
          minLength: 1
          maxLength: 32
          example: LINE-01
        location:
          type: string
          minLength: 1
          maxLength: 100
          example: 一车间 A 区
        manufacturer:
          type: [string, 'null']
          maxLength: 100
          example: 示例机床厂
        model:
          type: [string, 'null']
          maxLength: 100
          example: CNC-X1000
        responsibleDepartment:
          type: [string, 'null']
          maxLength: 100
          example: 机加车间
        currentStatus:
          $ref: '#/components/schemas/EquipmentStatus'
        enabled:
          type: boolean
          example: true
        version:
          type: integer
          minimum: 0
          example: 3
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      additionalProperties: false

    CreateEquipmentRequest:
      type: object
      required: [name, equipmentType, productionLineId, location]
