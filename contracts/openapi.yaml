          minLength: 1
          maxLength: 100
        equipmentType:
          type: string
          minLength: 1
          maxLength: 50
        productionLineId:
          type: string
          minLength: 1
          maxLength: 32
        location:
          type: string
          minLength: 1
          maxLength: 100
        manufacturer:
          type: [string, 'null']
          maxLength: 100
        model:
          type: [string, 'null']
          maxLength: 100
        responsibleDepartment:
          type: [string, 'null']
          maxLength: 100
      additionalProperties: false

    UpdateEquipmentRequest:
      type: object
      required: [expectedVersion]
