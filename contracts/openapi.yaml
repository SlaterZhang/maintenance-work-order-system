        expectedVersion:
          type: integer
          minimum: 0
        name:
          type: string
          minLength: 1
          maxLength: 100
        productionLineId:
          type: string
          minLength: 1
          maxLength: 32
        location:
          type: string
          minLength: 1
          maxLength: 100
        responsibleDepartment:
          type: [string, 'null']
          maxLength: 100
        enabled:
          type: boolean
      minProperties: 2
      additionalProperties: false

    EquipmentPage:
      type: object
      required: [items, page, pageSize, total, totalPages]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Equipment'
        page:
          type: integer
          minimum: 1
        pageSize:
          type: integer
          minimum: 1
        total:
          type: integer
          minimum: 0
        totalPages:
          type: integer
          minimum: 0
      additionalProperties: false

    TelemetrySample:
      type: object
      required:
        - sampleId
        - measuredAt
        - temperatureC
        - vibrationMmS
        - currentA
        - rotationalSpeedRpm
      properties:
        sampleId:
          type: string
          format: uuid
        measuredAt:
          type: string
          format: date-time
        temperatureC:
          type: number
          minimum: -50
          maximum: 250
          example: 78.5
        vibrationMmS:
          type: number
          minimum: 0
          maximum: 200
          example: 6.2
        currentA:
          type: number
          minimum: 0
          maximum: 10000
          example: 13.8
        rotationalSpeedRpm:
          type: number
          minimum: 0
          maximum: 100000
          example: 1450
      additionalProperties: false

    TelemetryBatchRequest:
      type: object
      required: [batchId, source, samples]
      properties:
        batchId:
          type: string
          format: uuid
        source:
          type: string
          enum: [SIMULATOR, DEVICE_GATEWAY, MANUAL_TEST]
        samples:
          type: array
          minItems: 1
          maxItems: 500
          items:
            $ref: '#/components/schemas/TelemetrySample'
      additionalProperties: false

    TelemetryIngestionResponse:
      type: object
      required:
        - batchId
        - equipmentId
        - acceptedCount
        - rejectedCount
        - duplicate
        - receivedAt
      properties:
        batchId:
          type: string
          format: uuid
        equipmentId:
          $ref: '#/components/schemas/EquipmentId'
        acceptedCount:
          type: integer
          minimum: 0
        rejectedCount:
          type: integer
          minimum: 0
        duplicate:
          type: boolean
        receivedAt:
          type: string
          format: date-time
      additionalProperties: false

    TelemetryPage:
      type: object
      required: [equipmentId, items, page, pageSize, total, totalPages]
      properties:
        equipmentId:
          $ref: '#/components/schemas/EquipmentId'
        items:
          type: array
          items:
            $ref: '#/components/schemas/TelemetrySample'
        page:
          type: integer
          minimum: 1
        pageSize:
          type: integer
          minimum: 1
        total:
          type: integer
          minimum: 0
        totalPages:
          type: integer
          minimum: 0
      additionalProperties: false

    HealthEvaluationRequest:
      type: object
      required: [evaluationId, equipmentId, requestedAt, sample]
      properties:
        evaluationId:
          type: string
          format: uuid
        equipmentId:
          $ref: '#/components/schemas/EquipmentId'
        requestedAt:
          type: string
          format: date-time
        sample:
          $ref: '#/components/schemas/TelemetrySample'
      additionalProperties: false

    HealthEvaluationResponse:
      type: object
      required:
        - evaluationId
        - equipmentId
        - healthScore
        - riskLevel
        - suspectedFault
        - recommendedAction
        - modelVersion
        - evaluatedAt
        - warningId
      properties:
        evaluationId:
          type: string
          format: uuid
        equipmentId:
          $ref: '#/components/schemas/EquipmentId'
        healthScore:
          type: number
          minimum: 0
          maximum: 100
          example: 42.5
        riskLevel:
          $ref: '#/components/schemas/RiskLevel'
        suspectedFault:
          type: string
          maxLength: 200
          example: 主轴轴承振动异常
        recommendedAction:
          type: string
          maxLength: 500
