openapi: 3.1.0
info:
  title: 工业设备智能运维系统 API 契约
  version: 2.0.0
  description: |
    本文件是成员 A（设备资产与监测）、B（健康评估与预警）、
    C（维修工单与备件）、D（身份、通知与集成）共同遵守的唯一 HTTP 契约。

    面向前端的请求统一通过本地网关 http://localhost:8080。
    服务间调用可使用各模块直连地址，并必须携带 X-Trace-Id、
    Idempotency-Key（写操作）和 X-Internal-Token。

    字段、枚举、状态码和路径的任何变更必须先修改本文件，
    再由提供方和调用方共同评审后实现。
servers:
  - url: http://localhost:8080
    description: 本地统一网关（成员 D 维护路由）
tags:
  - name: A-设备监测
    description: 成员 A 负责，服务端口 8101
  - name: B-故障预警
    description: 成员 B 负责，服务端口 8102
  - name: C-维修工单
    description: 成员 C 负责，服务端口 8103
  - name: D-身份通知
    description: 成员 D 负责，服务端口 8104
security:
  - bearerAuth: []

paths:
  /api/v1/equipment:
    get:
      tags: [A-设备监测]
      summary: 分页查询设备
      operationId: listEquipment
      x-contract-id: A-API-01
      x-owner-member: MEMBER_A
      x-owner-port: 8101
      parameters:
        - $ref: '#/components/parameters/TraceIdHeader'
        - name: keyword
          in: query
          description: 按设备编号或名称模糊查询
          schema:
            type: string
            maxLength: 50
        - name: productionLineId
          in: query
          schema:
            type: string
            maxLength: 32
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/EquipmentStatus'
        - $ref: '#/components/parameters/PageParameter'
        - $ref: '#/components/parameters/PageSizeParameter'
      responses:
        '200':
          description: 查询成功；items 为空表示没有匹配数据
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EquipmentPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [A-设备监测]
      summary: 新建设备档案
      operationId: createEquipment
      x-contract-id: A-API-02
      x-owner-member: MEMBER_A
      x-owner-port: 8101
      parameters:
        - $ref: '#/components/parameters/TraceIdHeader'
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEquipmentRequest'
      responses:
        '201':
          description: 创建成功；重复幂等请求返回同一设备
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Equipment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/equipment/{equipmentId}:
    parameters:
      - $ref: '#/components/parameters/EquipmentIdParameter'
    get:
      tags: [A-设备监测]
      summary: 查询单台设备完整档案
      operationId: getEquipmentById
      x-contract-id: C-INT-01
      x-owner-member: MEMBER_A
      x-caller-members: [MEMBER_B, MEMBER_C]
      x-owner-port: 8101
      security:
        - bearerAuth: []
        - internalToken: []
      parameters:
        - $ref: '#/components/parameters/TraceIdHeader'
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Equipment'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      tags: [A-设备监测]
      summary: 修改设备档案
      operationId: updateEquipment
      x-contract-id: A-API-03
      x-owner-member: MEMBER_A
      x-owner-port: 8101
      parameters:
        - $ref: '#/components/parameters/TraceIdHeader'
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateEquipmentRequest'
      responses:
        '200':
          description: 修改成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Equipment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/equipment/{equipmentId}/telemetry:
    parameters:
      - $ref: '#/components/parameters/EquipmentIdParameter'
    get:
      tags: [A-设备监测]
      summary: 查询设备运行数据
      operationId: listEquipmentTelemetry
      x-contract-id: A-API-04
      x-owner-member: MEMBER_A
      x-owner-port: 8101
      parameters:
        - $ref: '#/components/parameters/TraceIdHeader'
        - name: from
          in: query
          description: 起始时间，RFC 3339 UTC
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          description: 结束时间，RFC 3339 UTC
          schema:
            type: string
            format: date-time
        - $ref: '#/components/parameters/PageParameter'
        - $ref: '#/components/parameters/PageSizeParameter'
      responses:
        '200':
          description: 按 measuredAt 降序返回
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TelemetryPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [A-设备监测]
      summary: 批量接收设备运行数据
      operationId: ingestEquipmentTelemetry
      x-contract-id: A-API-05
      x-owner-member: MEMBER_A
      x-owner-port: 8101
      security:
        - bearerAuth: []
        - internalToken: []
      parameters:
        - $ref: '#/components/parameters/TraceIdHeader'
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TelemetryBatchRequest'
      responses:
        '202':
          description: 数据批次已接收；重复 batchId 不重复写入
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TelemetryIngestionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/integration/equipment-status-events:
    post:
      tags: [A-设备监测]
      summary: 接收工单引起的设备状态变化
      operationId: consumeEquipmentStatusChanged
      x-contract-id: C-INT-04
      x-owner-member: MEMBER_A
      x-caller-members: [MEMBER_C]
      x-owner-port: 8101
      security:
        - internalToken: []
      parameters:
        - $ref: '#/components/parameters/RequiredTraceIdHeader'
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EquipmentStatusChangedEvent'
      responses:
        '202':
          $ref: '#/components/responses/EventAccepted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/health-evaluations:
    post:
      tags: [B-故障预警]
      summary: 根据单次运行数据计算健康结果
      operationId: evaluateEquipmentHealth
      x-contract-id: C-INT-02
      x-owner-member: MEMBER_B
      x-caller-members: [MEMBER_A]
      x-owner-port: 8102
      security:
        - internalToken: []
      parameters:
        - $ref: '#/components/parameters/RequiredTraceIdHeader'
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HealthEvaluationRequest'
      responses:
        '200':
          description: 评估成功；达到 HIGH 或 CRITICAL 时 warningId 非空
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthEvaluationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/warnings:
    get:
      tags: [B-故障预警]
      summary: 分页查询故障预警
      operationId: listWarnings
      x-contract-id: B-API-01
      x-owner-member: MEMBER_B
      x-owner-port: 8102
      parameters:
        - $ref: '#/components/parameters/TraceIdHeader'
        - name: equipmentId
          in: query
          schema:
            $ref: '#/components/schemas/EquipmentId'
        - name: riskLevel
          in: query
          schema:
            $ref: '#/components/schemas/RiskLevel'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/WarningStatus'
        - $ref: '#/components/parameters/PageParameter'
        - $ref: '#/components/parameters/PageSizeParameter'
      responses:
        '200':
          description: 按 warningAt 降序返回
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WarningPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/warnings/{warningId}:
    parameters:
      - $ref: '#/components/parameters/WarningIdParameter'
    get:
      tags: [B-故障预警]
      summary: 查询预警详情
      operationId: getWarningById
      x-contract-id: B-API-02
      x-owner-member: MEMBER_B
      x-owner-port: 8102
      parameters:
        - $ref: '#/components/parameters/TraceIdHeader'
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Warning'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/warnings/{warningId}/acknowledgements:
    parameters:
      - $ref: '#/components/parameters/WarningIdParameter'
    post:
      tags: [B-故障预警]
      summary: 确认预警
      operationId: acknowledgeWarning
      x-contract-id: B-API-03
      x-owner-member: MEMBER_B
      x-owner-port: 8102
      parameters:
        - $ref: '#/components/parameters/TraceIdHeader'
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WarningAcknowledgementRequest'
      responses:
        '200':
          description: 确认成功；返回更新后的预警
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Warning'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/integration/maintenance-conclusions:
    post:
      tags: [B-故障预警]
      summary: 接收维修结论并更新预警闭环状态
      operationId: consumeMaintenanceConclusion
      x-contract-id: C-INT-05
      x-owner-member: MEMBER_B
      x-caller-members: [MEMBER_C]
      x-owner-port: 8102
      security:
        - internalToken: []
      parameters:
        - $ref: '#/components/parameters/RequiredTraceIdHeader'
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MaintenanceConclusionEvent'
      responses:
        '202':
          $ref: '#/components/responses/EventAccepted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/integration/warning-events:
    post:
      tags: [C-维修工单]
      summary: 接收高风险预警并自动建立或关联工单
      operationId: consumeWarningRaised
      x-contract-id: C-INT-03
      x-owner-member: MEMBER_C
      x-caller-members: [MEMBER_B]
      x-owner-port: 8103
      security:
        - internalToken: []
      parameters:
        - $ref: '#/components/parameters/RequiredTraceIdHeader'
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WarningRaisedEvent'
      responses:
        '202':
          description: 事件已接收；同一 warningId 只允许关联一张有效工单
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WarningAcceptedResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          description: LOW 或 MEDIUM 预警不满足自动建单条件
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/work-orders:
    get:
      tags: [C-维修工单]
      summary: 分页查询维修工单
      operationId: listWorkOrders
      x-contract-id: C-API-01
      x-owner-member: MEMBER_C
      x-owner-port: 8103
      parameters:
        - $ref: '#/components/parameters/TraceIdHeader'
        - name: equipmentId
          in: query
          schema:
            $ref: '#/components/schemas/EquipmentId'
        - name: warningId
          in: query
          schema:
            $ref: '#/components/schemas/WarningId'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/WorkOrderStatus'
        - name: assigneeId
          in: query
          schema:
            $ref: '#/components/schemas/UserId'
        - $ref: '#/components/parameters/PageParameter'
        - $ref: '#/components/parameters/PageSizeParameter'
      responses:
        '200':
          description: 按 createdAt 降序返回
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkOrderPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [C-维修工单]
      summary: 创建人工报修或巡检工单
      operationId: createManualWorkOrder
      x-contract-id: C-API-02
      x-owner-member: MEMBER_C
      x-owner-port: 8103
      parameters:
        - $ref: '#/components/parameters/TraceIdHeader'
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWorkOrderRequest'
      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkOrder'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/work-orders/{orderId}:
    parameters:
      - $ref: '#/components/parameters/OrderIdParameter'
    get:
      tags: [C-维修工单]
      summary: 查询工单详情
      operationId: getWorkOrderById
      x-contract-id: C-API-03
      x-owner-member: MEMBER_C
      x-owner-port: 8103
      parameters:
        - $ref: '#/components/parameters/TraceIdHeader'
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkOrder'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/work-orders/{orderId}/commands:
    parameters:
      - $ref: '#/components/parameters/OrderIdParameter'
    post:
      tags: [C-维修工单]
      summary: 执行工单状态命令
      description: |
        使用 action 驱动状态迁移。各 action 的允许源状态、目标状态、
        必填扩展字段和角色见 docs/06_详细接口约定与联调手册.md。
      operationId: executeWorkOrderCommand
      x-contract-id: C-API-04
      x-owner-member: MEMBER_C
      x-owner-port: 8103
      parameters:
        - $ref: '#/components/parameters/TraceIdHeader'
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkOrderCommandRequest'
      responses:
        '200':
          description: 命令成功；返回迁移后的完整工单
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkOrder'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/spare-parts:
    get:
      tags: [C-维修工单]
      summary: 分页查询备件和可用库存
      operationId: listSpareParts
      x-contract-id: C-API-05
      x-owner-member: MEMBER_C
      x-owner-port: 8103
      parameters:
        - $ref: '#/components/parameters/TraceIdHeader'
        - name: keyword
          in: query
          schema:
            type: string
            maxLength: 50
        - name: lowStockOnly
          in: query
          schema:
            type: boolean
            default: false
        - $ref: '#/components/parameters/PageParameter'
        - $ref: '#/components/parameters/PageSizeParameter'
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SparePartPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/work-orders/{orderId}/spare-requests:
    parameters:
      - $ref: '#/components/parameters/OrderIdParameter'
    post:
      tags: [C-维修工单]
      summary: 为工单提交备件申请
      operationId: createSpareRequest
      x-contract-id: C-API-06
      x-owner-member: MEMBER_C
      x-owner-port: 8103
      parameters:
        - $ref: '#/components/parameters/TraceIdHeader'
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSpareRequestRequest'
      responses:
        '201':
          description: 申请创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpareRequest'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/spare-requests/{requestId}/commands:
    parameters:
      - $ref: '#/components/parameters/SpareRequestIdParameter'
    post:
      tags: [C-维修工单]
      summary: 审批、预留、领用、退回或取消备件申请
      operationId: executeSpareRequestCommand
      x-contract-id: C-API-07
      x-owner-member: MEMBER_C
      x-owner-port: 8103
      parameters:
        - $ref: '#/components/parameters/TraceIdHeader'
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
