<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>工业设备智能运维平台 · 运维看板</title>
<script src="echarts.min.js"></script>
<link rel="stylesheet" href="css/platform.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="loading-bar" style="display:none;position:fixed;top:0;left:0;width:100%;height:3px;background:var(--cyan);z-index:9999"></div>
<div id="shell">
  <aside id="sidebar">
    <div class="logo">
      <div class="t1">工业设备智能运维<em>平台</em></div>
      <div class="t2">Industrial PdM Platform</div>
      <span class="ver">v2.1.0 · 契约 25 路径</span>
    </div>
    <div id="navroot"></div>
  </aside>
  <div id="main">
    <div id="topbar">
      <div id="crumb"></div>
      <div id="search"><span class="si">⌕</span>
        <input id="search-input" placeholder="搜索设备 / 工单 / 预警，回车跳转台账"></div>
      <button class="tbtn" id="side-toggle" title="收起 / 展开侧边栏" onclick="toggleSidebar()">⟨</button>
      <button class="tbtn" id="demo-btn" style="display:none" title="一键演示全链路：注入异常→预警→自动建单"
              onclick="runDemo()">🎬 演示</button>
      <button class="tbtn" id="status-toggle" style="display:none" title="查看会话状态">
        <span class="dot-badge" id="status-count">0</span>⚑</button>
      <button class="tbtn" title="通知中心" onclick="navigate('notify')">🔔<span class="dot-badge" id="bell-count">0</span></button>
      <button class="tbtn" title="帮助" onclick="showHelp()">?</button>
      <div class="who" id="who"></div>
      <button class="tbtn" title="退出登录" onclick="logout()">⏻</button>
    </div>
    <div id="basebar">
      <label>A 设备监测<input id="base-a" value="/a"></label>
      <label>B 故障预警<input id="base-b" value="/b"></label>
      <label>C 维修工单<input id="base-c" value="/c"></label>
      <label>D 身份通知<input id="base-d" value="/d"></label>
      <button id="basebar-reset" type="button">恢复默认</button>
      <span class="mini" id="basebar-hint">默认同源反代 <kbd>/a /b /c /d</kbd> · 服务运行 <kbd>bash scripts/start_all.sh</kbd></span>
    </div>
    <div id="status-bar" class="status-bar" style="display:none">
      <div class="status-dot"></div><span id="status-text">就绪</span>
    </div>
    <div id="content"></div>
  </div>
</div>

  <section class="view" id="view-login">
    <div class="card login-card">
      <h1>登录运维看板</h1>
      <div class="sub">工业设备智能运维与预测性维护系统 · 请使用种子账号登录</div>
      <div class="quick">
        <button onclick="fillUser('USER-D-001')" title="SYSTEM_ADMIN · ADMIN_ALL 全部权限（确认/派单/验收/取消）">系统管理员 USER-D-001</button>
        <button onclick="fillUser('USER-C-002')" title="MAINTENANCE_ENGINEER · 接单/开始维修/提交验收">工程师 USER-C-002</button>
        <button onclick="fillUser('USER-A-001')" title="EQUIPMENT_OPERATOR · 设备与遥测读写，工单只读">操作员 USER-A-001</button>
        <button onclick="fillUser('USER-C-003')" title="WAREHOUSE_MANAGER · 备件审批/发放（SPARE_APPROVE/SPARE_ISSUE）">仓管员 USER-C-003</button>
        <button onclick="fillUser('USER-B-001')" title="WARNING_ANALYST · 预警查阅与确认（WARNING_READ/WARNING_ACKNOWLEDGE）">预警分析师 USER-B-001</button>
        <button onclick="fillUser('USER-C-001')" title="MAINTENANCE_SUPERVISOR · 工单确认/派单/取消/验收（无 ADMIN_ALL）">维修主管 USER-C-001</button>
        <button onclick="fillUser('USER-C-004')" title="INSPECTOR · 工单验收（WORK_ORDER_INSPECT）">验收员 USER-C-004</button>
      </div>
      <div class="field"><label>用户名</label><input id="login-user" placeholder="USER-D-001"></div>
      <div class="field"><label>密码</label><input id="login-pass" type="password" placeholder="demo123456"></div>
      <button class="btn btn-cyan" id="login-btn" onclick="login()">登录</button>
      <div class="login-err" id="login-err"></div>
    </div>
  </section>
<div id="toasts"></div>

<script src="js/enums.js"></script>
<script src="js/config.js"></script>
<script src="js/util.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/views.js"></script>
<script src="js/platform.js"></script>
<script src="js/data.js"></script>
<script src="js/charts.js"></script>
<script src="js/inject.js"></script>
<script src="js/modals.js"></script>
<script src="js/pages/dash.js"></script>
<script src="js/pages/screen.js"></script>
<script src="js/pages/assets.js"></script>
<script src="js/pages/detail.js"></script>
<script src="js/pages/warns.js"></script>
<script src="js/pages/kanban.js"></script>
<script src="js/pages/orders.js"></script>
<script src="js/pages/spares.js"></script>
<script src="js/pages/rbac.js"></script>
<script src="js/pages/notify.js"></script>
<script src="js/pages/integ.js"></script>
<script src="js/pages/audit.js"></script>
<script src="js/pages/health.js"></script>
<script src="js/pages/odetail.js"></script>
<script src="js/pages/profile.js"></script>
<script src="js/pages/rules.js"></script>
<script src="js/pages/sreq.js"></script>
<script src="js/pages/plan.js"></script>
<script src="js/main.js"></script>
</body>
</html>
