<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>工业设备智能运维平台 · 界面原型 v2</title>
<style>
:root{
  --bg:#0b1220; --bg2:#111c30; --panel:#152238; --panel2:#18273f;
  --line:#223450; --line2:#2c4062;
  --txt:#dce6f5; --dim:#8ba0c0; --dim2:#5f7391;
  --cyan:#39d2ff; --green:#2fd88a; --yellow:#ffc53d; --red:#ff5c5c;
  --orange:#ff9040; --purple:#a86bff; --pink:#ff6bb5;
  --sidebar-w:222px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:linear-gradient(180deg,#0b1220 0%,#0d1526 100%);color:var(--txt);
  font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif;min-height:100vh;font-size:14px}
button,input,select{font-family:inherit}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#243650;border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:#31496b}

/* ============ 布局骨架 ============ */
#shell{display:flex;min-height:100vh}
#sidebar{width:var(--sidebar-w);flex:0 0 var(--sidebar-w);background:#0d1728;
  border-right:1px solid var(--line);display:flex;flex-direction:column;
  position:sticky;top:0;height:100vh;overflow-y:auto}
.logo{padding:16px 18px 14px;border-bottom:1px solid var(--line)}
.logo .t1{font-size:15px;font-weight:700;letter-spacing:.5px;line-height:1.3}
.logo .t1 em{color:var(--cyan);font-style:normal}
.logo .t2{font-size:11px;color:var(--dim2,#5f7391);margin-top:3px;letter-spacing:.3px}
.logo .ver{display:inline-block;margin-top:8px;font-size:10px;padding:1px 7px;border-radius:3px;
  background:rgba(57,210,255,.12);color:var(--cyan);border:1px solid rgba(57,210,255,.3)}
.navgrp{padding:10px 0 4px}
.navgrp>.gt{font-size:10.5px;color:#546d8f;letter-spacing:1.2px;
  padding:6px 18px 6px;text-transform:uppercase;font-weight:600}
.navi{display:flex;align-items:center;gap:9px;padding:7px 18px;cursor:pointer;
  font-size:13px;color:var(--dim);border-left:2px solid transparent;transition:.13s}
.navi:hover{background:rgba(57,210,255,.06);color:var(--txt)}
.navi.on{background:rgba(57,210,255,.1);color:var(--cyan);border-left-color:var(--cyan);font-weight:600}
.navi .ic{width:15px;text-align:center;font-size:12px;opacity:.9}
.navi .beta{margin-left:auto;font-size:9px;padding:1px 5px;border-radius:3px;
  background:rgba(168,107,255,.18);color:var(--purple);border:1px solid rgba(168,107,255,.35)}
.navi .cnt{margin-left:auto;font-size:10px;padding:0 6px;border-radius:9px;
  background:rgba(255,92,92,.2);color:var(--red);font-weight:700}

/* ============ 主区 ============ */
#main{flex:1;min-width:0;display:flex;flex-direction:column}
#topbar{height:52px;display:flex;align-items:center;gap:14px;padding:0 22px;
  border-bottom:1px solid var(--line);background:rgba(13,23,40,.7);
  backdrop-filter:blur(6px);position:sticky;top:0;z-index:50}
#crumb{font-size:13px;color:var(--dim)}
#crumb b{color:var(--txt);font-weight:600}
#crumb .sep{color:#3d5476;margin:0 6px}
#search{margin-left:auto;position:relative}
#search input{width:200px;background:var(--bg2);border:1px solid var(--line);color:var(--txt);
  padding:6px 10px 6px 28px;border-radius:7px;font-size:12.5px}
#search input:focus{outline:none;border-color:var(--cyan)}
#search .si{position:absolute;left:9px;top:6px;color:var(--dim2,#5f7391);font-size:12px}
.tbtn{background:transparent;border:1px solid var(--line);color:var(--dim);width:32px;height:32px;
  border-radius:7px;cursor:pointer;font-size:14px;display:flex;align-items:center;
  justify-content:center;position:relative}
.tbtn:hover{color:var(--cyan);border-color:var(--cyan)}
.tbtn .dot-badge{position:absolute;top:-4px;right:-4px;min-width:15px;height:15px;
  background:var(--red);color:#fff;border-radius:8px;font-size:9px;font-weight:700;
  display:flex;align-items:center;justify-content:center;padding:0 3px}
.who{display:flex;align-items:center;gap:8px;font-size:12.5px;padding-left:12px;
  border-left:1px solid var(--line)}
.who .av{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,#a86bff,#7a3cff);
  display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff}
.who .nm{line-height:1.2}
.who .nm small{display:block;color:var(--dim2,#5f7391);font-size:10.5px}
.rolechip{font-size:10.5px;padding:1px 7px;border-radius:9px;background:rgba(57,210,255,.12);
  color:var(--cyan);border:1px solid rgba(57,210,255,.3)}

#content{padding:20px 22px 44px;flex:1}
.page{display:none;animation:fadein .22s}
.page.on{display:block}
@keyframes fadein{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

/* ============ 通用组件 ============ */
.hdr{display:flex;align-items:flex-end;gap:14px;margin-bottom:14px;flex-wrap:wrap}
.hdr h1{font-size:20px;font-weight:700;letter-spacing:.3px}
.hdr .sub{font-size:12.5px;color:var(--dim);padding-bottom:2px}
.hdr .sp{flex:1}
.notice{display:flex;gap:10px;align-items:flex-start;padding:9px 13px;border-radius:8px;
  font-size:12.5px;line-height:1.6;margin-bottom:14px;border:1px solid}
.notice .ni{font-size:14px;line-height:1.3}
.notice.live{background:rgba(47,216,138,.07);border-color:rgba(47,216,138,.28);color:#a9e8c9}
.notice.live b{color:var(--green)}
.notice.plan{background:rgba(168,107,255,.07);border-color:rgba(168,107,255,.3);color:#d3bdf5}
.notice.plan b{color:var(--purple)}
.notice.info{background:rgba(57,210,255,.06);border-color:rgba(57,210,255,.25);color:#b3e2f7}
.notice.info b{color:var(--cyan)}
.notice.warn{background:rgba(255,197,61,.07);border-color:rgba(255,197,61,.28);color:#f3dfa6}
.notice.warn b{color:var(--yellow)}

.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:15px}
.card.p2{background:var(--panel2)}
.card h3{font-size:13.5px;color:var(--dim);font-weight:600;margin-bottom:12px;
  letter-spacing:.4px;display:flex;align-items:center;gap:7px}
.card h3 .r{margin-left:auto;font-size:11px;color:var(--dim2,#5f7391);font-weight:400}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:1fr 1fr}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
.g5{grid-template-columns:repeat(5,1fr)}
.g6{grid-template-columns:repeat(6,1fr)}
.g-2-1{grid-template-columns:2fr 1fr}
.g-1-2{grid-template-columns:1fr 2fr}
.g-3-2{grid-template-columns:3fr 2fr}
.mt{margin-top:14px} .mt2{margin-top:20px}
@media(max-width:1400px){.g6{grid-template-columns:repeat(3,1fr)}.g5{grid-template-columns:repeat(3,1fr)}}
@media(max-width:1150px){.g4,.g3,.g-2-1,.g-1-2,.g-3-2,.g2{grid-template-columns:1fr 1fr}
  .g6,.g5{grid-template-columns:repeat(2,1fr)}}

/* KPI 卡 */
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:10px;
  padding:14px 15px;position:relative;overflow:hidden}
.kpi::after{content:"";position:absolute;left:0;top:0;bottom:0;width:3px}
.kpi.k-cyan::after{background:var(--cyan)} .kpi.k-green::after{background:var(--green)}
.kpi.k-yellow::after{background:var(--yellow)} .kpi.k-red::after{background:var(--red)}
.kpi.k-purple::after{background:var(--purple)} .kpi.k-orange::after{background:var(--orange)}
.kpi .kl{font-size:12px;color:var(--dim);display:flex;align-items:center;gap:6px}
.kpi .kv{font-size:30px;font-weight:700;font-family:Consolas,monospace;margin:5px 0 1px;line-height:1}
.kpi .kf{font-size:11.5px;color:var(--dim2,#5f7391);display:flex;align-items:center;gap:5px}
.kpi .up{color:var(--green)} .kpi .dn{color:var(--red)}
.k-cyan .kv{color:var(--cyan)} .k-green .kv{color:var(--green)}
.k-yellow .kv{color:var(--yellow)} .k-red .kv{color:var(--red)}
.k-purple .kv{color:var(--purple)} .k-orange .kv{color:var(--orange)}

/* 表格 */
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{color:var(--dim);font-weight:600;text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);
  font-size:11.5px;letter-spacing:.4px;white-space:nowrap;background:rgba(13,23,40,.4)}
th.s{cursor:pointer} th.s:hover{color:var(--cyan)}
td{padding:9px 10px;border-bottom:1px solid rgba(34,52,80,.45);white-space:nowrap}
tbody tr:hover{background:rgba(57,210,255,.045)}
tbody tr.clk{cursor:pointer}
.tbl-wrap{overflow-x:auto;margin:0 -15px -15px;padding:0 15px 2px}
.mono{font-family:Consolas,monospace}

/* 徽章/pill/dot */
.pill{padding:2px 9px;border-radius:999px;font-size:11.5px;white-space:nowrap;display:inline-block}
.b-CRITICAL,.b-red{background:rgba(255,92,92,.18);color:var(--red)}
.b-HIGH,.b-orange{background:rgba(255,144,64,.18);color:var(--orange)}
.b-MEDIUM,.b-yellow{background:rgba(255,197,61,.15);color:var(--yellow)}
.b-LOW,.b-dim{background:rgba(139,160,192,.15);color:var(--dim)}
.b-green,.b-OK,.b-COMPLETED,.b-RESOLVED{background:rgba(47,216,138,.15);color:var(--green)}
.b-cyan{background:rgba(57,210,255,.14);color:var(--cyan)}
.b-purple{background:rgba(168,107,255,.16);color:var(--purple)}
.b-PENDING_CONFIRMATION{background:rgba(255,197,61,.15);color:var(--yellow)}
.b-PENDING_ASSIGNMENT,.b-PENDING_ACCEPTANCE{background:rgba(57,210,255,.13);color:var(--cyan)}
.b-PENDING_MAINTENANCE{background:rgba(139,160,192,.15);color:var(--dim)}
.b-MAINTAINING{background:rgba(255,92,92,.15);color:var(--red)}
.b-WAITING_PARTS,.b-PENDING_INSPECTION{background:rgba(255,144,64,.15);color:var(--orange)}
.b-CANCELLED{background:rgba(100,116,139,.2);color:#94a3b8}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:0 0 auto}
.d-green{background:var(--green);box-shadow:0 0 6px rgba(47,216,138,.6)}
.d-yellow{background:var(--yellow);box-shadow:0 0 6px rgba(255,197,61,.6)}
.d-red{background:var(--red);box-shadow:0 0 6px rgba(255,92,92,.6)}
.d-cyan{background:var(--cyan);box-shadow:0 0 6px rgba(57,210,255,.6)}
.d-dim{background:#5f7391}
.pulse{animation:pl 1.8s infinite}
@keyframes pl{0%,100%{opacity:1}50%{opacity:.35}}

/* 按钮 */
.btn{border:none;border-radius:7px;padding:7px 14px;font-size:12.5px;cursor:pointer;
  transition:.14s;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:disabled{opacity:.42;cursor:not-allowed}
.btn-p{background:linear-gradient(135deg,#39d2ff,#1fa8e8);color:#04202e;font-weight:600}
.btn-p:hover:not(:disabled){box-shadow:0 0 13px rgba(57,210,255,.45)}
.btn-g{background:linear-gradient(135deg,#2fd88a,#1fbf75);color:#062818;font-weight:600}
.btn-d{background:linear-gradient(135deg,#ff5c5c,#ff2d55);color:#fff;font-weight:600}
.btn-v{background:linear-gradient(135deg,#a86bff,#7a3cff);color:#fff;font-weight:600}
.btn-o{background:transparent;border:1px solid var(--line);color:var(--dim)}
.btn-o:hover:not(:disabled){color:var(--cyan);border-color:var(--cyan)}
.btn-sm{padding:4px 10px;font-size:11.5px;border-radius:6px}
.btn-group{display:flex;gap:7px;flex-wrap:wrap}

/* 工具条 */
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.toolbar input,.toolbar select{background:var(--bg2);border:1px solid var(--line);color:var(--txt);
  padding:6px 10px;border-radius:6px;font-size:12.5px}
.toolbar input:focus,.toolbar select:focus{outline:none;border-color:var(--cyan)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:14px;flex-wrap:wrap}
.tabs button{background:transparent;border:none;border-bottom:2px solid transparent;color:var(--dim);
  padding:9px 15px;cursor:pointer;font-size:13px;transition:.14s}
.tabs button:hover{color:var(--txt)}
.tabs button.on{color:var(--cyan);border-bottom-color:var(--cyan);font-weight:600}
.tabpane{display:none} .tabpane.on{display:block}

/* 列表项 */
.li{display:flex;gap:11px;align-items:flex-start;padding:10px 2px;
  border-bottom:1px solid rgba(34,52,80,.45);font-size:12.5px}
.li:last-child{border-bottom:none}
.li .lt{flex:1;min-width:0}
.li .l1{color:var(--txt);line-height:1.45}
.li .l2{color:var(--dim2,#5f7391);font-size:11.5px;margin-top:3px;display:flex;gap:10px;flex-wrap:wrap}
.li .lv{margin-left:auto;text-align:right;flex:0 0 auto}
.empty{text-align:center;color:var(--dim2,#5f7391);padding:30px 10px;font-size:12.5px}
.empty .ei{font-size:26px;display:block;margin-bottom:8px;opacity:.5}

/* 进度/条 */
.bar{height:5px;border-radius:3px;background:rgba(34,52,80,.8);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:3px}
.i-green{background:var(--green)} .i-yellow{background:var(--yellow)}
.i-red{background:var(--red)} .i-cyan{background:var(--cyan)}
.i-purple{background:var(--purple)} .i-orange{background:var(--orange)}
.mini{font-size:11.5px;color:var(--dim2,#5f7391)}

/* Kanban */
.kanban{display:grid;grid-template-columns:repeat(6,minmax(190px,1fr));gap:12px;overflow-x:auto;padding-bottom:6px}
.kcol{background:rgba(13,23,40,.5);border:1px solid var(--line);border-radius:9px;padding:11px}
.kcol .kh{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:600;
  color:var(--dim);margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.kcol .kh .n{margin-left:auto;font-size:11px;background:rgba(34,52,80,.9);padding:1px 7px;border-radius:8px}
.kcard{background:var(--panel2);border:1px solid var(--line2);border-radius:7px;padding:9px 10px;
  margin-bottom:8px;cursor:pointer;transition:.14s;border-left:3px solid var(--line2)}
.kcard:hover{border-color:var(--cyan);transform:translateX(2px)}
.kcard.p1{border-left-color:var(--red)} .kcard.p2{border-left-color:var(--orange)}
.kcard.p3{border-left-color:var(--yellow)} .kcard.p4{border-left-color:var(--dim)}
.kcard .kt{font-size:12px;line-height:1.4;color:var(--txt)}
.kcard .km{font-size:10.5px;color:var(--dim2,#5f7391);margin-top:5px;display:flex;gap:7px;flex-wrap:wrap}

/* 时间线 */
.timeline{position:relative;padding-left:22px}
.timeline::before{content:"";position:absolute;left:5px;top:5px;bottom:5px;width:1px;background:var(--line2)}
.tl{position:relative;padding-bottom:16px}
.tl::before{content:"";position:absolute;left:-21px;top:4px;width:11px;height:11px;border-radius:50%;
  background:var(--panel);border:2px solid var(--line2)}
.tl.ok::before{border-color:var(--green);background:rgba(47,216,138,.25)}
.tl.now::before{border-color:var(--cyan);background:rgba(57,210,255,.3);animation:pl 1.6s infinite}
.tl.warn::before{border-color:var(--orange);background:rgba(255,144,64,.25)}
.tl .tt{font-size:12.5px;color:var(--txt)}
.tl .td{font-size:11.5px;color:var(--dim2,#5f7391);margin-top:3px;line-height:1.5}
.tl .tm{font-size:11px;color:#546d8f;font-family:Consolas,monospace}

/* 说明条/角标 */
.tag{font-size:10px;padding:1px 6px;border-radius:3px;letter-spacing:.3px}
.tag-live{background:rgba(47,216,138,.16);color:var(--green);border:1px solid rgba(47,216,138,.35)}
.tag-plan{background:rgba(168,107,255,.16);color:var(--purple);border:1px solid rgba(168,107,255,.35)}
.tag-new{background:rgba(57,210,255,.16);color:var(--cyan);border:1px solid rgba(57,210,255,.35)}

/* 占位图（演进页） */
.ph{background:repeating-linear-gradient(45deg,rgba(168,107,255,.05) 0 10px,
  rgba(168,107,255,.09) 10px 20px);border:1px dashed rgba(168,107,255,.4);
  border-radius:8px;padding:20px;text-align:center;color:#c3a9ef;font-size:12px}
.chartbox{background:#0e1a2c;border:1px solid var(--line);border-radius:8px;
  height:190px;position:relative;display:flex;align-items:center;justify-content:center}
svg.spark{display:block;width:100%;height:100%}

/* 侧栏收起按钮 */
#sideToggle{margin-left:auto;background:transparent;border:none;color:var(--dim2,#5f7391);
  cursor:pointer;font-size:13px;padding:2px 6px}
#sideToggle:hover{color:var(--cyan)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--dim2,#5f7391)}
.legend i{width:9px;height:9px;border-radius:2px;display:inline-block;margin-right:5px}

/* 补充：面包屑 / 侧栏收起 / 导航文字 */
#crumb .cb1{color:#5f7391}
#crumb .csep{color:#3d5476;margin:0 6px}
#crumb .cb2{color:#e6eefc;font-weight:600}
.navi .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.navi .tag{margin-left:auto;font-size:9px;padding:1px 5px}
.navi .cnt{margin-left:auto}
#sidebar{transition:width .16s ease,flex-basis .16s ease;overflow:hidden}
#sidebar.mini{width:56px;flex:0 0 56px}
#sidebar.mini .logo .t1,#sidebar.mini .logo .t2,#sidebar.mini .logo .ver{display:none}
#sidebar.mini .navgrp{font-size:0;padding:8px 0 2px;text-align:center}
#sidebar.mini .navgrp::before{content:"·";font-size:14px;color:#2f4260}
#sidebar.mini .navi{justify-content:center;padding:9px 0}
#sidebar.mini .navi .nm,#sidebar.mini .navi .tag,#sidebar.mini .navi .cnt{display:none}
#sidebar.mini .navi .ic{width:auto;font-size:15px}
#sidebar.mini #sideToggle{position:absolute;top:10px;right:6px;margin:0}
.logo{position:relative}
/* 工具栏内复选框与日期 */
.toolbar label{white-space:nowrap;cursor:pointer}
.toolbar input[type=checkbox]{accent-color:#39d2ff;cursor:pointer}
.toolbar input[type=date]{color-scheme:dark}
/* 表格内嵌 sparkline 尺寸 */
td svg.spark{width:74px;height:22px;display:block}
/* 小圆点 pulse */
@keyframes pl{0%,100%{opacity:1}50%{opacity:.35}}

</style>
</head>
<body>
<div id="shell">
  <aside id="sidebar">
    <div class="logo">
      <div class="t1">工业设备智能运维<em>平台</em></div>
      <div class="t2">Industrial PdM Platform</div>
      <span class="ver">v2.1.0 · 契约 23 路径</span>
    </div>
    <div id="navroot"></div>
  </aside>
  <div id="main">
    <div id="topbar">
      <div id="crumb"></div>
      <div id="search"><span class="si">⌕</span><input placeholder="搜索设备 / 工单 / 预警"></div>
      <button class="tbtn" title="环境切换">⇄</button>
      <button class="tbtn" title="通知中心">🔔<span class="dot-badge">6</span></button>
      <button class="tbtn" title="帮助">?</button>
      <div class="who">
        <div class="av">管</div>
        <div class="nm">系统管理员<small>USER-D-001</small></div>
        <span class="rolechip">SYSTEM_ADMIN</span>
      </div>
    </div>
    <div id="content"></div>
  </div>
</div>
<script>
/* ================= 导航定义 ================= */
const NAV = [
  {g:"运营总览", items:[
    {id:"dash",  ic:"◈", n:"驾驶舱首页"},
    {id:"screen",ic:"▣", n:"实时监控大屏", tag:"new"},
  ]},
  {g:"设备管理", items:[
    {id:"assets",ic:"⚙", n:"设备资产台账"},
    {id:"detail",ic:"◉", n:"设备详情"},
    {id:"profile",ic:"▤", n:"设备档案铭牌", tag:"new"},
  ]},
  {g:"健康与预警", items:[
    {id:"health",ic:"♥", n:"健康评估中心"},
    {id:"warns", ic:"⚠", n:"预警中心", cnt:6},
    {id:"rules", ic:"⚖", n:"预警规则阈值", tag:"new"},
  ]},
  {g:"维修管理", items:[

<script>
/* ================= 渲染工具 ================= */
const $ = s => document.querySelector(s);
const h = (s) => String(s==null?"":s).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function kpi(cls,l,v,f){return `<div class="kpi k-${cls}"><div class="kl">${l}</div><div class="kv">${v}</div><div class="kf">${f||""}</div></div>`;}
function pill(t,cls){return `<span class="pill ${cls}">${h(t)}</span>`;}
function spark(pts,color,fill){
  const w=100,hh=32,mx=Math.max(...pts),mn=Math.min(...pts),rg=(mx-mn)||1;
  const d=pts.map((p,i)=>`${i?"L":"M"}${(i/(pts.length-1)*w).toFixed(1)},${(hh-2-((p-mn)/rg)*(hh-6)).toFixed(1)}`).join(" ");
  const fa=fill?`<path d="${d} L${w},${hh} L0,${hh} Z" fill="${color}" opacity=".13"/>`:"";
  return `<svg class="spark" viewBox="0 0 ${w} ${hh}" preserveAspectRatio="none">${fa}
    <path d="${d}" fill="none" stroke="${color}" stroke-width="1.6" stroke-linejoin="round"/></svg>`;
}
function donut(pct,color,size=74,label=""){
  const r=(size-10)/2,c=2*Math.PI*r,off=c*(1-pct/100);
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="#223450" stroke-width="7"/>
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${color}" stroke-width="7"
      stroke-dasharray="${c}" stroke-dashoffset="${off}" stroke-linecap="round"
      transform="rotate(-90 ${size/2} ${size/2})"/>
    <text x="50%" y="50%" text-anchor="middle" dy=".34em" fill="${color}"
      font-size="${size>60?15:12}" font-family="Consolas" font-weight="700">${pct}%</text>
  </svg>`;
}
function bars(items,color){
  const mx=Math.max(...items.map(i=>i[1]))||1;
  return items.map(([n,v])=>`<div style="margin-bottom:9px">
    <div style="display:flex;font-size:11.5px;margin-bottom:4px">
      <span style="color:var(--dim)">${h(n)}</span>
      <span style="margin-left:auto;font-family:Consolas;color:var(--txt)">${v}</span></div>
    <div class="bar"><i class="${color}" style="width:${(v/mx*100).toFixed(1)}%"></i></div></div>`).join("");
}
function notice(kind,text){
  const ic={live:"✔",plan:"◐",info:"ℹ",warn:"⚠"}[kind];
  return `<div class="notice ${kind}"><span class="ni">${ic}</span><div>${text}</div></div>`;
}
function noticeLive(t){return notice("live",t);}
function noticePlan(t){return notice("plan",t);}
function pageHdr(title,sub,right){
  return `<div class="hdr"><h1>${h(title)}</h1><div class="sub">${sub||""}</div>
    <div class="sp"></div>${right||""}</div>`;
}
function eqRow(e,sel){
  return `<tr class="clk ${sel?"":""}" onclick="go('detail')">
    <td><span class="dot ${ST_CLS[e.st]}"></span></td>
    <td class="mono" style="color:var(--cyan)">${e.id}</td>
    <td>${h(e.n)}</td><td class="mini">${e.line} · ${e.area}</td>
    <td>${pill(ST_ZH[e.st], e.st==="RUNNING"?"b-green":e.st==="MAINTAINING"?"b-red":e.st==="TRIAL_RUNNING"?"b-yellow":"b-dim")}</td>
    <td class="mono" style="color:${e.h>=80?"var(--green)":e.h>=60?"var(--yellow)":"var(--red)"};font-weight:700">${e.h}</td>
    <td class="mono">${e.mv}</td><td class="mono">${e.mt}</td>
    <td class="mini">${e.mtbf}h</td><td class="mini">${e.score}</td>
  </tr>`;
}
</script>

/* ================= 页面：归因诊断（演进） ================= */
function pgShap(){
  const feats=[["振动 RMS",38.5],["温度均值",22.4],["电流谐波",6.6],["转速偏差",0.6],["环境温度",-1.2],["负载率",-2.8]];
  const mx=Math.max(...feats.map(f=>Math.abs(f[1])));
  return pageHdr("归因诊断","从「健康分 30.7」到「为什么是 30.7」",
    `<span class="tag tag-plan">演进中</span>`)
  + noticePlan(`<b>演进中 · 部分已实现</b> — 当前已有<b>规则分解</b>（逐指标扣分：振动 −38.5、温度 −22.4…），
      这是"分数怎么算出来的"，<b>但不是</b>"模型为什么这么判断"。<br>
      本页规划引入 <b>SHAP / Integrated Gradients</b>，把模型结论归因到<b>具体传感器与时段</b>。
      <b>关键纠正</b>：注意力权重<b>不能</b>当解释用——Jain &amp; Wallace (NAACL 2019) 已证明
      注意力分布可被大幅扰动而输出不变。注意力只能作为<b>探查线索</b>，正式归因必须用 SHAP / IG。`)
  + `<div class="grid g4 mt">
      ${kpi("cyan","当前归因方式","规则分解","已实现")}
      ${kpi("purple","规划方式","SHAP / IG","P1")}
      ${kpi("yellow","可解释传感器",6,"覆盖 4 类指标")}
      ${kpi("red","黑盒结论",0,"全部可追溯")}
     </div>
     <div class="grid g-3-2 mt">
      <div class="card"><h3>特征贡献瀑布图<span class="r">SHAP · EQ-000001 · 健康分 30.7</span></h3>
        ${feats.map(([n,v])=>`<div style="margin-bottom:11px">
          <div style="display:flex;font-size:11.5px;margin-bottom:4px">
            <span style="color:var(--dim)">${h(n)}</span>
            <span style="margin-left:auto;font-family:Consolas;color:${v>0?"var(--red)":"var(--green)"}">${v>0?"+":""}${v}</span></div>
          <div style="display:flex;align-items:center;gap:6px">
            <div style="flex:1;display:flex;justify-content:flex-end">
              ${v>0?`<div style="height:13px;background:linear-gradient(90deg,rgba(255,92,92,.35),rgba(255,92,92,.85));border-radius:2px;width:${Math.abs(v)/mx*100}%"></div>`:""}
            </div>
            <div style="width:1px;height:17px;background:var(--line2)"></div>
            <div style="flex:1">
              ${v<0?`<div style="height:13px;background:linear-gradient(90deg,rgba(47,216,138,.85),rgba(47,216,138,.35));border-radius:2px;width:${Math.abs(v)/mx*100}%"></div>`:""}
            </div></div></div>`).join("")}
        <div class="legend mt"><span><i style="background:var(--red)"></i>推高风险（正值）</span>
          <span><i style="background:var(--green)"></i>降低风险（负值）</span>
          <span>基线健康分 100.0 → 实际 30.7</span></div>
      </div>
      <div>
        <div class="card"><h3>传感器热力时段<span class="r">异常集中在哪里</span></h3>
          <div class="chartbox" style="padding:10px 12px;display:block;height:auto">
            ${(()=>{ // 4 指标 × 24 时段 热力网格（贡献强度）
              const metrics=["振动","温度","电流","转速"];
              // 构造 4×24 贡献矩阵：振动为持续上升（后段渐深），温度中段突起，电流/转速稀疏
              const mk=(base,grow,spikes)=>{const r=[];for(let t=0;t<24;t++){
                let v=base+t*grow;
                spikes.forEach(([a,b,amp])=>{if(t>=a&&t<=b)v+=amp*Math.exp(-Math.pow(t-(a+b)/2,2)/26);});
                r.push(Math.min(1,v));}
                return r;};
              const M=[
                mk(0.06,0.028,[[12,17,0.35]]),                       // 振动：持续劣化
                mk(0.04,0.006,[[14,18,0.72]]),                       // 温度：中段突升
                mk(0.03,0.004,[[16,18,0.42]]),                       // 电流
                mk(0.02,0.002,[[15,16,0.10]])                        // 转速
              ];
              const cell=(v)=>{ // 浅青 -> 黄 -> 红
                const a=Math.max(0,Math.min(1,v));
                return a<0.5?`rgba(57,210,255,${(a*1.5).toFixed(2)})`:`rgba(255,92,92,${((a-0.5)*2*0.9+0.25).toFixed(2)})`;};
              return `<div style="display:grid;grid-template-columns:46px repeat(24,1fr);gap:2px;align-items:center;margin-bottom:4px">
                ${metrics.map((m,r)=>`<div class="mini" style="text-align:right;padding-right:5px;font-size:10px;white-space:nowrap">${m}</div>`
                  +M[r].map((v,t)=>`<div title="${m} ${String(t).padStart(2,"0")}:00 贡献 ${v.toFixed(2)}"
                    style="height:22px;border-radius:2px;background:${cell(v)}"></div>`).join("")).join("")}
                <div></div>
                <div class="mini" style="grid-column:span 6;font-size:9.5px;font-family:Consolas">00:00</div>
                <div class="mini" style="grid-column:span 6;font-size:9.5px;font-family:Consolas;text-align:center">06:00</div>
                <div class="mini" style="grid-column:span 6;font-size:9.5px;font-family:Consolas;text-align:center">12:00</div>
                <div class="mini" style="grid-column:span 6;font-size:9.5px;font-family:Consolas;text-align:right">18:00</div>
              </div>
              <div style="display:flex;align-items:center;gap:5px;font-size:10.5px;color:var(--dim2)">
                <span>贡献强度</span>
                ${[0.1,0.3,0.5,0.7,0.9].map(v=>`<i style="background:${cell(v)};width:20px;height:9px;border-radius:2px;display:inline-block"></i>`).join("")}
                <span>低 → 高</span>
              </div>`;})()}
          </div>
          <div class="mini mt">用途：判断是<b>突发</b>（单格深）还是<b>持续劣化</b>（整行渐深），前者查外部扰动，后者查磨损。</div>
        </div>
        <div class="card mt"><h3>可解释性方法可靠性<span class="r">已核实</span></h3>
          <table><thead><tr><th>方法</th><th>能否作为归因</th><th>说明</th></tr></thead><tbody>
            <tr><td>规则分解</td><td>${pill("可以","b-green")}</td><td class="mini">确定性、可复算，但仅限规则覆盖的指标</td></tr>
            <tr><td>SHAP</td><td>${pill("可以","b-green")}</td><td class="mini">有博弈论保证；模型无关，计算量随特征数增长</td></tr>
            <tr><td>Integrated Gradients</td><td>${pill("可以","b-green")}</td><td class="mini">适合神经网络；需选好基线</td></tr>
            <tr><td>注意力权重</td><td>${pill("不可以","b-red")}</td><td class="mini">可被扰动而不改输出（Jain &amp; Wallace 2019）</td></tr>
            <tr><td>TimeSHAP</td><td>${pill("可以参考","b-yellow")}</td><td class="mini">时序版 SHAP（KDD 2021），适合定位时段</td></tr>
          </tbody></table>
        </div>
      </div>
     </div>`;
}

function renderNav(cur){

}
function go(id){
  if(!PAGES[id]) return;
  document.getElementById("content").innerHTML = PAGES[id]();
  document.getElementById("content").scrollTop = 0;
  window.scrollTo(0,0);
  renderNav(id);
  const c = CRUMB[id]||["",""];
  document.getElementById("crumb").innerHTML =
    `<span class="cb1">${c[0]}</span><span class="csep">/</span><span class="cb2">${c[1]}</span>`;
}
function tab(btn,i){
  const box = btn.closest(".card");
  box.querySelectorAll(".tabs button").forEach((b,j)=>b.classList.toggle("on", j===i));
  const panes = box.querySelectorAll(".tabpane");
  panes.forEach((p,j)=>p.classList.toggle("on", j===i));
}

  go("dash");
});
