# Wave 4e 单端口统一入口：公网只开放 8888（+22 SSH），四服务与看板全部经 nginx
#
# 目标架构（把暴露面从 4 端口缩到 1 端口）：
#   浏览器 ──> :8888 nginx ──┬── /            → web/index.html（静态托管，阶段2拆分入口）
#                          ├── /a/api/...    → 127.0.0.1:8101（A 设备监测）
#                          ├── /b/api/...    → 127.0.0.1:8102（B 故障预警）
#                          ├── /c/api/...    → 127.0.0.1:8103（C 维修工单）
#                          └── /d/api/...    → 127.0.0.1:8104（D 身份通知）
#
# 部署（Debian/Ubuntu，nginx 默认 sites-available / sites-enabled 结构）：
#   sudo apt install -y nginx
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/ims
#   sudo ln -s /etc/nginx/sites-available/ims /etc/nginx/sites-enabled/ims
#   sudo rm -f /etc/nginx/sites-enabled/default     # 移除默认站点，避免抢占 80
#   sudo nginx -t && sudo systemctl reload nginx
#   验证：curl http://127.0.0.1:8888/a/health（四条 /a /b /c /d 应全部 {"status":"UP",...}）
#
# 本文件与演示服务器 /etc/nginx/sites-available/ims 保持同口径（阶段4已同步：
# 端口 8888 + 仓库路径 /root/maintenance-work-order-system）。
# 看板默认服务地址即同源 /a /b /c /d（阶段2 basebar 默认值，公网零配置）。
# uvicorn 仅绑 127.0.0.1（scripts/start_all.sh 默认，LISTEN_HOST 环境变量控制）。

server {
    listen 8888;
    server_name _;

    # ---- 前端看板：静态托管仓库 web/ 目录，默认首页 index.html ----
    # 阶段2前端拆分（2026-10-06）：入口 index.html + css/ + js/ 模块（零构建）。
    # 旧 dashboard.html / dashboard.js / equipment.js 已于 2026-10-12 清理删除，
    # 原注释所称"保留为兼容重定向"与实际不符（nginx 从未配置该重定向），已更正。
    # 注意：root 必须是绝对路径，部署时请按实际 clone 位置修改，
    # 例如仓库在 /home/dev/maintenance-work-order-system，则改为
    # root /home/dev/maintenance-work-order-system/web;
    root /root/maintenance-work-order-system/web;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # ---- 缓存策略 ----
    # 起因：本项目的 JS/CSS 用固定文件名（无内容哈希后缀），而 nginx 默认只发
    # ETag、不发 Cache-Control，浏览器会按启发式规则长时间缓存静态资源。
    # 后果是「服务端文件已更新、用户刷新仍是旧页面」——排查时极像代码没生效。
    #
    # 因此：HTML 一律不缓存（保证总能拿到新的 script 标签），
    # 静态资源用 no-cache + ETag（未变走 304，变了立刻生效）。
    # 若将来给资源加上内容哈希文件名，可把这里放开为长期 immutable。
    location ~* \.html?$ {
        # expires 会另发一个 Cache-Control: no-cache，与上面重复，故只用 add_header
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri $uri/ =404;
    }

    location ~* \.(js|css)$ {
        add_header Cache-Control "no-cache, must-revalidate" always;
        etag on;
        try_files $uri =404;
    }

    # ---- 四服务代理 ----
    # proxy_pass 结尾的斜杠会剥掉 /a|b|c|d 前缀，后端只见 /api/v1/...：
    #   /a/api/v1/equipment → 127.0.0.1:8101/api/v1/equipment
    #   /a/health           → 127.0.0.1:8101/health（验证代理通就用这个路径）
    location /a/ {
        proxy_pass http://127.0.0.1:8101/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /b/ {
        proxy_pass http://127.0.0.1:8102/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /c/ {
        proxy_pass http://127.0.0.1:8103/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /d/ {
        proxy_pass http://127.0.0.1:8104/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
