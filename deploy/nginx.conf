# Wave 4e 单端口统一入口：公网只开放 80（+22 SSH），四服务与看板全部经 nginx
#
# 目标架构（把暴露面从 4 端口缩到 1 端口）：
#   浏览器 ──> :80 nginx ──┬── /            → web/index.html（静态托管，阶段2拆分入口）
#                          ├── /a/api/...    → 127.0.0.1:8101（A 设备监测）
#                          ├── /b/api/...    → 127.0.0.1:8102（B 故障预警）
#                          ├── /c/api/...    → 127.0.0.1:8103（C 维修工单）
#                          └── /d/api/...    → 127.0.0.1:8104（D 身份通知）
#
# 部署（Debian/Ubuntu，nginx 默认 sites-available / sites-enabled 结构）：
#   sudo apt install -y nginx
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/ims
#   sudo ln -s /etc/nginx/sites-available/ims /etc/nginx/sites-enabled/ims
#   sudo rm -f /etc/nginx/sites-enabled/default     # 移除默认站点，避免抢占 80
#   sudo nginx -t && sudo systemctl reload nginx
#   验证：curl http://127.0.0.1/a/health（四条 /a /b /c /d 应全部 {"status":"UP",...}）
#
# 看板四个服务地址框填写：http://<服务器IP>/a  /b  /c  /d（带路径前缀）
# uvicorn 退回仅绑 127.0.0.1（scripts/start_all.sh 默认，LISTEN_HOST 环境变量控制）。

server {
    listen 80;
    server_name _;

    # ---- 前端看板：静态托管仓库 web/ 目录，默认首页 index.html ----
    # 阶段2前端拆分（2026-10-06）：入口 index.html + css/ + js/ 模块（零构建），
    # 旧 dashboard.html 保留为兼容重定向。
    # 注意：root 必须是绝对路径，部署时请按实际 clone 位置修改，
    # 例如仓库在 /home/dev/maintenance-work-order-system，则改为
    # root /home/dev/maintenance-work-order-system/web;
    root /opt/maintenance-work-order-system/web;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # ---- 四服务代理 ----
    # proxy_pass 结尾的斜杠会剥掉 /a|b|c|d 前缀，后端只见 /api/v1/...：
    #   /a/api/v1/equipment → 127.0.0.1:8101/api/v1/equipment
    #   /a/health           → 127.0.0.1:8101/health（验证代理通就用这个路径）
    location /a/ {
        proxy_pass http://127.0.0.1:8101/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /b/ {
        proxy_pass http://127.0.0.1:8102/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /c/ {
        proxy_pass http://127.0.0.1:8103/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /d/ {
        proxy_pass http://127.0.0.1:8104/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
